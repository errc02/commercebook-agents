# Publishes one package when its tag is pushed:
#   mcp-v0.3.0  -> @commercebook/mcp on npm      (packages/mcp)
#   sdk-v0.1.0  -> @commercebook/sdk on npm      (packages/sdk)
#   py-v0.1.0   -> commercebook on PyPI          (packages/python)
# The tag's version must match the package's version. Secrets: NPM_TOKEN (an automation token of the @commercebook
# organisation) and PYPI_API_TOKEN (a token scoped to the commercebook project).
name: publish

on:
  push:
    tags:
      - 'mcp-v*'
      - 'sdk-v*'
      - 'py-v*'

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: startsWith(github.ref_name, 'mcp-v') || startsWith(github.ref_name, 'sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Pick the package
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            mcp-v*) echo "dir=packages/mcp" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#mcp-v}" >> "$GITHUB_OUTPUT" ;;
            sdk-v*) echo "dir=packages/sdk" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check the version
        run: test "$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")" = "${{ steps.pkg.outputs.version }}"
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspace ${{ steps.pkg.outputs.dir }}
      - run: npm publish --workspace ${{ steps.pkg.outputs.dir }} --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the version
        run: test "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "${GITHUB_REF_NAME#py-v}"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
